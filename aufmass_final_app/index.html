<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Aufmass-App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Startseite: Projektliste -->
  <div id="homeScreen" class="screen">
    <header class="app-header">
      <div class="header-title">
        <h1>Aufmass-App</h1>
      </div>
      <button id="newProjectBtn" class="btn btn-primary">+ Neues Projekt</button>
    </header>
    <main class="screen-content">
      <div id="projectList" class="project-list"></div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon-box"></div>
        <h2>Keine Projekte</h2>
        <p>Tippen Sie auf &bdquo;+ Neues Projekt&ldquo; um zu beginnen.</p>
      </div>
    </main>
  </div>

  <!-- Projektansicht -->
  <div id="projectScreen" class="screen hidden">
    <header class="app-header">
      <button id="backBtn" class="btn btn-ghost">&#8592; Zuruck</button>
      <h1 id="projectScreenTitle">Projekt</h1>
      <button id="deleteProjectBtn" class="btn btn-danger-ghost">Loschen</button>
    </header>
    <main class="screen-content">

      <!-- 1. Anschrift -->
      <section class="card">
        <h2 class="card-title">Anschrift</h2>
        <div class="form-row">
          <div class="form-group" style="flex: 3">
            <label class="form-label">Strasse</label>
            <input class="form-input" type="text" id="fieldStrasse" placeholder="Musterstrasse" autocomplete="street-address" />
          </div>
          <div class="form-group" style="flex: 1">
            <label class="form-label">Nr.</label>
            <input class="form-input" type="text" id="fieldNummer" placeholder="1a" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex: 1">
            <label class="form-label">PLZ</label>
            <input class="form-input" type="text" id="fieldPlz" placeholder="12345" inputmode="numeric" maxlength="5" />
          </div>
          <div class="form-group" style="flex: 2">
            <label class="form-label">Ort</label>
            <input class="form-input" type="text" id="fieldOrt" placeholder="Musterstadt" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Bauherr / Auftraggeber</label>
          <input class="form-input" type="text" id="fieldBauherr" placeholder="Herr Muster GmbH" />
        </div>
      </section>

      <!-- 2. Gerusttyp -->
      <section class="card">
        <h2 class="card-title">Gerusttyp</h2>
        <div class="type-selector" id="geruesttypSelector">
          <button class="type-btn active" data-type="fassade">Fassaden-Gerust</button>
          <button class="type-btn" data-type="dach">Dach-Gerust</button>
          <button class="type-btn" data-type="sonder">Sonder-Gerust</button>
        </div>
        <div id="sonderNameRow" style="margin-top:10px; display:none;">
          <input class="form-input" type="text" id="fieldSonderName" placeholder="Bezeichnung fur Sonder-Gerust" />
        </div>
      </section>

      <!-- 3. Hausseiten -->
      <section class="card">
        <div class="section-header">
          <h2 class="card-title">Hausseiten</h2>
          <button id="addSideBtn" class="btn btn-primary btn-sm">+ Seite</button>
        </div>
        <div id="seitenContainer"></div>
        <div id="noSidesHint" class="no-sides-hint">
          Noch keine Seiten erfasst. Tippen Sie auf &bdquo;+ Seite&ldquo;.
        </div>
      </section>

      <!-- 4. Zusammenfassung -->
      <section class="card">
        <h2 class="card-title">Zusammenfassung</h2>
        <div id="summaryContent">
          <p class="summary-empty">Noch keine Seiten erfasst.</p>
        </div>
      </section>

      <!-- 5. Aktionen -->
      <section class="card action-card">
        <div class="action-buttons">
          <button id="saveProjectBtn" class="btn btn-primary btn-full">Speichern</button>
          <button id="exportPdfBtn" class="btn btn-secondary btn-full">PDF erstellen</button>
        </div>
        <div class="action-buttons-secondary">
          <button id="exportJsonBtn" class="btn btn-ghost btn-sm">JSON exportieren</button>
          <button id="importJsonBtn" class="btn btn-ghost btn-sm">JSON laden</button>
        </div>
        <input type="file" id="importFileInput" accept="application/json" style="display:none;" />
      </section>

    </main>
  </div>

  <div id="toastEl" class="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
